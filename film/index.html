<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rubin Observatory — from the filter to the stars (film)</title>
  <style>
    #caption { position: fixed; left: 50%; top: 6%; transform: translateX(-50%); width: max-content; max-width: 92vw; text-align: center;
      font: 600 clamp(14px, 3.1vh, 34px)/1.35 system-ui, sans-serif; color: #f1f4f8; text-shadow: 0 1px 6px #000, 0 0 2px #000;
      transition: opacity .4s; pointer-events: none; }
    /* closing card (?endcard), 1920×1080 reference; sizes follow the viewport height */
    #endcard { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center;
      gap: 2.2vh; background: #05070a; color: #f1f4f8; font-family: system-ui, sans-serif; text-align: center; }
    #endcard h1 { margin: 0; font: 600 5.2vh/1.1 system-ui, sans-serif; letter-spacing: .02em; }
    #endcard p { margin: 0; font-size: 2.6vh; color: #b8c2cf; max-width: 80vw; }
    #endcard b { margin-top: 3vh; font-weight: 500; font-size: 2.4vh; color: #7fb6ff; letter-spacing: .02em; }
    #endcard small { position: absolute; left: 0; right: 0; top: 88%; font-size: 1.6vh; color: #8a94a3; letter-spacing: .03em; }
    #clock { position: fixed; right: 12px; top: 10px; font: 11px monospace; opacity: .5; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="caption"></div>
  <div id="clock"></div>
  <div id="endcard"><h1></h1><p></p><b></b><small></small></div>
  <script type="module" src="/src/apps/film.ts"></script>
</body>
</html>
